<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TDI · Consultant Education &amp; Certification Review — FY27</title>
<style>
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface-1:#fcfcfb;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --brand:#12406f;
  --series-1:#185090; --series-2:#eb6834; --series-3:#1baf7a;
  --ord-1:#86b6ef; --ord-2:#4a86d0; --ord-3:#12406f;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#006300; --wash:rgba(18,64,111,0.07); --hover:rgba(11,11,11,0.035);
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 6px 20px rgba(11,11,11,.05);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface-1:#1a1a19;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --brand:#5a9ae0;
  --series-1:#4a90d9; --series-2:#d95926; --series-3:#199e70;
  --ord-1:#8fbcf0; --ord-2:#4a90d9; --ord-3:#1d548f;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#0ca30c; --wash:rgba(90,154,224,0.13); --hover:rgba(255,255,255,0.04);
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 80px}
a{color:var(--brand)}

header.top{border-bottom:1px solid var(--border); background:var(--surface-1)}
.top-inner{max-width:1240px;margin:0 auto;padding:24px 24px 20px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
h1{font-size:27px;line-height:1.2;margin:7px 0 6px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--text-secondary);font-size:14px;margin:0;max-width:72ch}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{
  font:inherit;font-size:13px;background:var(--surface-1);color:var(--text-primary);
  border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;
}
.btn:hover{background:var(--hover)}
a.btn{text-decoration:none;display:inline-block}
.btn.primary{background:var(--brand);color:#fff;border-color:transparent;font-weight:550}
a.btn.primary{color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{
  font:inherit;font-size:13px;font-weight:550;background:var(--surface-1);color:var(--text-secondary);
  border:none;padding:7px 13px;cursor:pointer
}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}

nav.tabs{position:sticky;top:0;z-index:30;background:var(--surface-1);border-bottom:1px solid var(--border)}
.tabs-inner{max-width:1240px;margin:0 auto;padding:0 24px;display:flex;gap:2px;overflow-x:auto}
.tab{
  font:inherit;font-size:13.5px;font-weight:520;background:none;border:none;cursor:pointer;
  padding:13px 14px;color:var(--text-secondary);border-bottom:2px solid transparent;white-space:nowrap;
}
.tab:hover{color:var(--text-primary)}
.tab[aria-selected="true"]{color:var(--text-primary);border-bottom-color:var(--brand);font-weight:620}
.panel[hidden]{display:none}
.panel{padding-top:28px}

.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.card-pad{padding:20px 22px}
.card h2,.chartcard h2{font-size:16px;margin:0 0 3px;font-weight:620;letter-spacing:-.005em}
.card h3{font-size:13.5px;margin:0 0 2px;font-weight:620}
.note{font-size:12.5px;color:var(--text-muted);margin:0 0 16px}
.grid{display:grid;gap:16px}
.section{margin-bottom:24px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);
  text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .12s, transform .12s;position:relative;display:block;width:100%}
.tile:hover{border-color:color-mix(in srgb,var(--brand) 55%,var(--border));transform:translateY(-1px)}
.tile:hover .go{opacity:1}
.tile .go{position:absolute;top:14px;right:14px;font-size:13px;color:var(--brand);opacity:.35;transition:opacity .12s}
.tile .lab{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.tile .val{font-size:31px;font-weight:640;letter-spacing:-.02em;margin:5px 0 1px;line-height:1.05}
.tile .sup{font-size:12.5px;color:var(--text-secondary)}
.tile.accent{border-color:color-mix(in srgb,var(--critical) 45%,var(--border))}
.tile.accent .val{color:var(--critical)}

.callout{display:flex;gap:14px;padding:16px 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface-1);box-shadow:var(--shadow)}
.callout .ic{flex:0 0 auto;width:22px;height:22px;margin-top:1px}
.callout.crit{border-left:3px solid var(--critical)}
.callout.info{border-left:3px solid var(--brand)}
.callout p{margin:5px 0 0;color:var(--text-secondary);font-size:13.5px}
.callout strong{color:var(--text-primary)}

/* action cards */
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.action{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);border-left:3px solid var(--brand)}
.action.urgent{border-left-color:var(--critical)}
.action .k{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);font-weight:650}
.action .h{font-size:15px;font-weight:640;margin:6px 0 5px;line-height:1.3}
.action .h em{font-style:normal;color:var(--critical)}
.action p{margin:0;font-size:13px;color:var(--text-secondary);line-height:1.5}
.action .who{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px}
.action .who span{font-size:11.5px;background:var(--plane);border:1px solid var(--border);border-radius:6px;padding:2px 7px;color:var(--text-secondary)}
.action .cta{margin-top:11px;font-size:12.5px;font-weight:600}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2.5px 8px;border-radius:999px;border:1px solid var(--border);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.chip.good .dot{background:var(--good)} .chip.good{color:var(--good-ink)}
.chip.warn .dot{background:var(--warning)}
.chip.crit .dot{background:var(--critical)} .chip.crit{color:var(--critical)}
.chip.neutral{color:var(--text-secondary)} .chip.neutral .dot{background:var(--text-muted)}
.chip.fy27{color:var(--critical);border-color:color-mix(in srgb,var(--critical) 40%,var(--border))}

.filters{
  display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;
  background:var(--surface-1);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;margin-bottom:16px;
  position:sticky;top:45px;z-index:22;
  box-shadow:0 1px 2px rgba(11,11,11,.05), 0 6px 14px rgba(11,11,11,.06)
}
/* masks the gap between the stuck filter bar and the stuck table header */
.filters::after{content:'';position:absolute;left:-1px;right:-1px;top:100%;height:17px;background:var(--plane)}
.filters label{font-size:11.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.fgroup{display:flex;flex-direction:column}
input[type=search],select{
  font:inherit;font-size:13.5px;padding:7px 9px;border-radius:8px;
  border:1px solid var(--border);background:var(--plane);color:var(--text-primary);min-width:130px
}
input[type=search]{min-width:230px}
input:focus-visible,select:focus-visible,button:focus-visible,tr:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.count{margin-left:auto;font-size:12.5px;color:var(--text-secondary);padding-bottom:7px}

.tablewrap{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
@media(max-width:1000px){.tablewrap{overflow-x:auto}.tablewrap table{min-width:1000px}}
table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
thead th{
  text-align:left;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);
  font-weight:650;padding:11px 10px;border-bottom:1px solid var(--border);background:var(--surface-1);
  position:sticky;top:45px;z-index:5;cursor:pointer;user-select:none;
  box-shadow:inset 0 -1px 0 var(--border);
}
#rosterTable thead th, #certTable thead th{top:var(--tableTop,45px)}
thead th.nosort{cursor:default}
thead th .arr{opacity:.4;font-size:9px;margin-left:3px}
thead th[aria-sort] .arr{opacity:1;color:var(--brand)}
tbody td{padding:10px 10px;border-bottom:1px solid var(--grid);vertical-align:middle;overflow-wrap:anywhere}
tbody tr:last-child td{border-bottom:none}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--hover)}
tbody tr.open{background:var(--wash)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.name{font-weight:600}
.mail{color:var(--text-muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{font-size:12px;color:var(--text-secondary)}
#rosterTable col.c0{width:19%} #rosterTable col.c1{width:8%} #rosterTable col.c2{width:8.5%}
#rosterTable col.c3{width:7%} #rosterTable col.c4{width:15%} #rosterTable col.c5{width:6%}
#rosterTable col.c6{width:6%} #rosterTable col.c7{width:8%} #rosterTable col.c8{width:12.5%}
#rosterTable col.c9{width:10%}
#certTable col.k0{width:16%} #certTable col.k1{width:28%} #certTable col.kL{width:7%} #certTable col.k2{width:8%}
#certTable col.k3{width:10%} #certTable col.k4{width:10%} #certTable col.k5{width:9%} #certTable col.k6{width:12%}
.lvl{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 6px;border-radius:5px;border:1px solid var(--border)}
.lvl.bcp{background:var(--brand);color:#fff;border-color:transparent}
.lvl.bca{color:var(--text-secondary);background:var(--plane)}
.rev{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.02em;
  padding:2px 7px;border-radius:5px;color:#8a5a00;background:rgba(250,178,25,.16);
  border:1px solid color-mix(in srgb,var(--warning) 55%,transparent);white-space:nowrap}
:root[data-theme="dark"] .rev{color:var(--warning);background:rgba(250,178,25,.14)}
tr.reviewrow td{background:rgba(250,178,25,.07)}
#benchTable col.b0{width:26%} #benchTable col.b1{width:14%} #benchTable col.b2{width:14%}
#benchTable col.b3{width:14%} #benchTable col.b4{width:32%}
#certTitleTable col.t0{width:58%} #certTitleTable col.t1{width:10%}
#certTitleTable col.t2{width:12%} #certTitleTable col.t3{width:20%}

.meter{display:flex;align-items:center;gap:8px;min-width:120px}
.meter .track{flex:1;height:7px;border-radius:4px;background:var(--grid);overflow:hidden;display:flex;gap:2px}
.meter .seg2{height:100%;border-radius:4px}
.meter .pct{font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums;min-width:32px;text-align:right}

tr.detail>td{padding:0;background:var(--wash);border-bottom:1px solid var(--border)}
.detail-in{padding:18px 20px 22px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.dgrid{grid-template-columns:1fr}}
.dcol h4{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin:0 0 9px;font-weight:650}
.list{border:1px solid var(--border);border-radius:9px;background:var(--surface-1);max-height:320px;overflow:auto}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-bottom:1px solid var(--grid);font-size:12.5px}
.li:last-child{border-bottom:none}
.li .t{flex:1;line-height:1.35}
.li .m{color:var(--text-muted);font-size:11.5px;margin-top:2px}
.empty{padding:16px;color:var(--text-muted);font-size:12.5px;text-align:center}

.chartcard{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:20px 22px 16px;box-shadow:var(--shadow)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 14px}
.legend .item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-secondary)}
.legend .sw{width:11px;height:11px;border-radius:3px}
svg{display:block;max-width:100%;overflow:visible}
.tt{
  position:fixed;pointer-events:none;z-index:100;background:var(--surface-1);color:var(--text-primary);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;
  box-shadow:0 4px 16px rgba(0,0,0,.14);opacity:0;transition:opacity .09s;max-width:290px
}
.tt.on{opacity:1}
.tt b{display:block;margin-bottom:2px}
.bigbar{display:flex;gap:2px;height:34px;border-radius:6px;overflow:hidden;margin:6px 0 10px}
.bigbar div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border-radius:5px}

.statuskey{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.sk{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:var(--plane)}
.sk .chip{flex:0 0 auto;margin-top:1px}
.sk b{display:block;font-size:12.5px;font-weight:650;margin-bottom:1px}
.sk span[data-t]{font-size:12.5px;color:var(--text-secondary);line-height:1.4}
.prose{max-width:80ch}
.prose p{color:var(--text-secondary);font-size:14px}
.prose li{color:var(--text-secondary);font-size:14px;margin-bottom:7px}
.prose h3{color:var(--text-primary);font-size:14.5px;margin:22px 0 7px}
.prose code{background:var(--plane);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:12.5px}
.steps{counter-reset:s;list-style:none;padding:0;margin:14px 0}
.steps li{counter-increment:s;position:relative;padding-left:38px;margin-bottom:14px;color:var(--text-secondary);font-size:14px}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:-1px;width:25px;height:25px;border-radius:50%;
  background:var(--brand);color:#fff;font-size:12.5px;font-weight:650;display:flex;align-items:center;justify-content:center
}
.steps li b{color:var(--text-primary)}
pre.tpl{
  background:var(--plane);border:1px solid var(--border);border-radius:10px;padding:16px 18px;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.65;
  white-space:pre-wrap;color:var(--text-secondary);margin:0
}
.tplhead{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:880px){.twocol{grid-template-columns:1fr}.top-right{margin-left:0}.grid[style]{grid-template-columns:1fr !important}}
footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--border);color:var(--text-muted);font-size:12.5px}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div>
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="h1"></h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="top-right">
      <div class="seg" role="group" aria-label="Language / Idioma">
        <button type="button" id="langEn" aria-pressed="true">English</button>
        <button type="button" id="langEs" aria-pressed="false">Español</button>
      </div>
      <button class="btn" id="themeBtn" type="button"></button>
      <a class="btn primary" id="mailTop" href="#" data-t="btnMail"></a>
    </div>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-inner" role="tablist">
    <button class="tab" role="tab" data-p="overview" aria-selected="true" data-t="tabOverview"></button>
    <button class="tab" role="tab" data-p="roster" aria-selected="false" data-t="tabRoster"></button>
    <button class="tab" role="tab" data-p="certs" aria-selected="false" data-t="tabCerts"></button>
    <button class="tab" role="tab" data-p="coverage" aria-selected="false" data-t="tabCoverage"></button>
    <button class="tab" role="tab" data-p="manage" aria-selected="false" data-t="tabManage"></button>
    <button class="tab" role="tab" data-p="notes" aria-selected="false" data-t="tabNotes"></button>
  </div>
</nav>

<div class="wrap">

<!-- ============ OVERVIEW ============ -->
<section class="panel" id="p-overview" role="tabpanel">
  <div class="tiles" id="tiles"></div>

  <div class="section">
    <div class="callout crit">
      <svg class="ic" viewBox="0 0 20 20" fill="none" stroke="var(--critical)" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="8"/><path d="M10 6v5M10 13.6v.1"/></svg>
      <div><strong id="cliffHead"></strong><p id="cliffBody"></p></div>
    </div>
  </div>

  <div class="section">
    <h2 style="font-size:16px;margin:0 0 3px;font-weight:620" data-t="attnTitle"></h2>
    <p class="note" data-t="attnNote"></p>
    <div class="actions" id="actions"></div>
  </div>

  <div class="section grid" style="grid-template-columns:1fr 1fr">
    <div class="chartcard">
      <h2 data-t="chStatusTitle"></h2>
      <p class="note" data-t="chStatusNote"></p>
      <div class="bigbar" id="statusBar"></div>
      <table style="margin-top:10px;table-layout:auto"><tbody id="statusTable"></tbody></table>
      <p class="note" style="margin:14px 0 0" data-t="chStatusFoot"></p>
    </div>
    <div class="chartcard">
      <h2 data-t="chQTitle"></h2>
      <p class="note" data-t="chQNote"></p>
      <div id="qChart"></div>
    </div>
  </div>

  <div class="section chartcard">
    <h2 data-t="chMTitle"></h2>
    <p class="note" data-t="chMNote"></p>
    <div id="mChart"></div>
  </div>

  <div class="section twocol">
    <div class="chartcard">
      <h2 data-t="chTopCertTitle"></h2>
      <p class="note" data-t="chTopCertNote"></p>
      <div id="topCerts"></div>
    </div>
    <div class="chartcard">
      <h2 data-t="chTopOpenTitle"></h2>
      <p class="note" data-t="chTopOpenNote"></p>
      <div id="topOpen"></div>
    </div>
  </div>
</section>

<!-- ============ ROSTER ============ -->
<section class="panel" id="p-roster" role="tabpanel" hidden>
  <div class="callout info section">
    <svg class="ic" viewBox="0 0 20 20" fill="none" stroke="var(--brand)" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="8"/><path d="M10 9v5M10 6.4v.1"/></svg>
    <div><strong data-t="rosterCalloutH"></strong><p data-t="rosterCalloutP"></p></div>
  </div>

  <div class="section card card-pad" style="padding:16px 18px">
    <h3 style="font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin:0 0 12px" data-t="legendH"></h3>
    <div class="statuskey">
      <div class="sk"><span class="chip good"><span class="dot"></span><span data-t="statusActive"></span></span><div><b data-t="legActiveW"></b><span data-t="legActiveM"></span></div></div>
      <div class="sk"><span class="chip warn"><span class="dot"></span><span data-t="statusSlipping"></span></span><div><b data-t="legSlipW"></b><span data-t="legSlipM"></span></div></div>
      <div class="sk"><span class="chip crit"><span class="dot"></span><span data-t="statusStale"></span></span><div><b data-t="legStaleW"></b><span data-t="legStaleM"></span></div></div>
    </div>
    <p class="note" style="margin:13px 0 0" data-t="legendFoot"></p>
  </div>

  <div class="filters">
    <div class="fgroup"><label for="q" data-t="fSearch"></label><input type="search" id="q"></div>
    <div class="fgroup"><label for="fEntity" data-t="fEntity"></label><select id="fEntity"></select></div>
    <div class="fgroup"><label for="fCountry" data-t="fCountry"></label><select id="fCountry"></select></div>
    <div class="fgroup"><label for="fStatus" data-t="fStatus"></label><select id="fStatus"></select></div>

 footer2:'Roster changes: ',
 notes:`<h2>What is in here, and where it came from</h2>
<p>Two Learning @ Helix exports, filtered to the TDI branches only: a course-progress export covering every enrollment, and the July FY27 certification export. Nothing has been added or estimated beyond the derived fields described below.</p>
<ul>
<li><b>Course progress</b> — 1,507 enrollment records across 100 consultants, spanning enrollments from 18 Apr 2023 to 20 Jul 2026.</li>
<li><b>Certifications</b> — 209 active certification records across 47 consultants.</li>
<li><b>Branches included</b> — <code>Partners &gt; VAR Resellers &gt; TDI S.A.</code> (96 consultants) and <code>Partners &gt; VAR Resellers.Gosi.Distributors &gt; TDI LATAM SA de CV</code> (4 consultants).</li>
<li><b>Two records are marked UNDER REVIEW</b> at TDI&rsquo;s request — see the banner on the Certifications tab. They are shown rather than removed, because the platform still reports them as active and the correction has not yet been made at source.</li>
<li><b>Consultant email addresses have been deliberately removed from this file</b> — not hidden, removed. Names are kept because a lead needs them to act; the addresses added nothing here and would have been the one genuinely sensitive thing in a shared link. If you need a version with emails for a bulk platform action, ask us for it directly rather than circulating this one.</li>
<li><b>Certification levels</b> — <b>BCA</b> is BMC Certified Associate and <b>BCP</b> is BMC Certified Professional. TDI holds 190 BCA and 19 BCP. Level is read from the certification title, which is how the platform records it.</li>
<li><b>Nothing in this export has already expired.</b> All 209 certification records carry a status of Active, so &ldquo;expired today&rdquo; is zero. The distinction that matters here is between the 134 that stay valid into FY28 and beyond and the 75 that lapse during FY27 — that is the split used throughout.</li>
<li><b>Course and certification titles are shown exactly as they appear in the platform</b> — they are official BMC product and exam names and are not translated in either language.</li>
</ul>
<h3>Two things the export does not do well — stated plainly</h3>
<ul>
<li><b>69 of the 100 consultants have no platform last-access date.</b> The field is simply empty for them. Rather than show them all as never active, last activity here is derived from the most recent real event on the record — a course completion, a course access, a certification issue date, or an enrollment. Where the platform&rsquo;s own last-access date exists, that is used. Each row states which source it used.</li>
<li><b>The Course Progress (%) column is not reliable.</b> It reads 0 for 1,456 of the 1,507 rows, including for courses marked completed, so it has been left out entirely. Course status — Completed, In Progress, Enrolled — is shown instead, because that field is populated on every row.</li>
</ul>
<h3>How the derived fields work</h3>
<ul>
<li><b>Last activity</b> = the most recent of: platform last access, course completion date, course last-access date, certification issue date, enrollment date.</li>
<li><b>Activity status</b> — Active is activity within 30 days, Slipping is 31–90 days, Stale is over 90 days or no dated activity at all.</li>
<li><b>Open coursework</b> = enrollments marked In Progress plus those marked Enrolled but never started.</li>
<li><b>Bench after FY27</b> = consultants certified in a product line, minus those whose only certification in that line lapses before 31 March 2027.</li>
<li><b>FY27</b> is taken as <b>1 April 2026 – 31 March 2027</b>. If TDI runs a different fiscal calendar, tell us and we re-cut it.</li>
<li>Everything is a snapshot as of <b>30 July 2026</b>. It does not refresh on its own.</li>
</ul>
<h3>What this file is not</h3>
<p>It is a read-only snapshot for review, not a live system. Changing anything — adding a consultant, removing one, re-enrolling someone — happens in Learning @ Helix, and the fastest route is the email on the <b>Add / remove consultants</b> tab.</p>`,

 footer2:'Cambios de roster: ',
 notes:`<h2>Qué contiene y de dónde viene</h2>
<p>Dos exports de Learning @ Helix, filtrados únicamente a las sucursales de TDI: un export de avance de cursos con todas las inscripciones y el export de certificaciones FY27 de julio. No se agregó ni estimó nada más allá de los campos derivados que se describen abajo.</p>
<ul>
<li><b>Avance de cursos</b> — 1,507 registros de inscripción de 100 consultores, con inscripciones entre el 18 abr 2023 y el 20 jul 2026.</li>
<li><b>Certificaciones</b> — 209 registros de certificaciones vigentes de 47 consultores.</li>
<li><b>Sucursales incluidas</b> — <code>Partners &gt; VAR Resellers &gt; TDI S.A.</code> (96 consultores) y <code>Partners &gt; VAR Resellers.Gosi.Distributors &gt; TDI LATAM SA de CV</code> (4 consultores).</li>
<li><b>Dos registros están marcados EN REVISIÓN</b> a pedido de TDI — ver el aviso en la pestaña de Certificaciones. Se muestran en lugar de eliminarse, porque la plataforma aún los reporta como activos y la corrección todavía no se hizo en el origen.</li>
<li><b>Los correos de los consultores fueron eliminados deliberadamente de este archivo</b>, no ocultados: eliminados. Se conservan los nombres porque un líder los necesita para actuar; las direcciones no aportaban nada aquí y habrían sido lo único realmente sensible en un enlace compartido. Si necesitas una versión con correos para una acción masiva en la plataforma, pídenosla directamente en lugar de hacer circular esta.</li>
<li><b>Niveles de certificación</b> — <b>BCA</b> es BMC Certified Associate y <b>BCP</b> es BMC Certified Professional. TDI tiene 190 BCA y 19 BCP. El nivel se toma del título de la certificación, que es como lo registra la plataforma.</li>
<li><b>Nada en este export está vencido.</b> Los 209 registros de certificación tienen estado Activo, así que &ldquo;vencidas hoy&rdquo; es cero. La distinción relevante es entre las 134 que siguen válidas en FY28 y después y las 75 que vencen durante FY27: esa es la división que se usa en todo el documento.</li>
<li><b>Los títulos de cursos y certificaciones aparecen exactamente como están en la plataforma</b>: son nombres oficiales de productos y exámenes de BMC y no se traducen en ninguno de los dos idiomas.</li>
</ul>
<h3>Dos limitaciones del export, dichas con claridad</h3>
<ul>
<li><b>69 de los 100 consultores no tienen fecha de último acceso a la plataforma.</b> El campo simplemente viene vacío. En lugar de mostrarlos a todos como nunca activos, aquí la última actividad se deriva del evento real más reciente del registro: la finalización de un curso, un acceso a curso, la fecha de emisión de una certificación o una inscripción. Cuando sí existe la fecha propia de la plataforma, se usa esa. Cada fila indica qué fuente se usó.</li>
<li><b>La columna Course Progress (%) no es confiable.</b> Marca 0 en 1,456 de las 1,507 filas, incluso en cursos marcados como completados, por lo que se excluyó por completo. En su lugar se muestra el estado del curso — Completado, En curso, Inscrito — porque ese campo sí viene poblado en todas las filas.</li>
</ul>
<h3>Cómo se calculan los campos derivados</h3>
<ul>
<li><b>Última actividad</b> = la más reciente entre: último acceso a la plataforma, fecha de finalización de curso, último acceso al curso, fecha de emisión de certificación y fecha de inscripción.</li>
<li><b>Estado de actividad</b> — Al día es actividad en los últimos 30 días, Perdiendo ritmo entre 31 y 90 días, Inactivo más de 90 días o sin actividad con fecha.</li>
<li><b>Cursos abiertos</b> = inscripciones marcadas En curso más las marcadas Inscrito pero nunca iniciadas.</li>
<li><b>Base tras FY27</b> = consultores certificados en una línea de producto, menos aquellos cuya única certificación en esa línea vence antes del 31 de marzo de 2027.</li>
<li><b>FY27</b> se toma como <b>1 de abril de 2026 – 31 de marzo de 2027</b>. Si TDI usa otro calendario fiscal, avísanos y lo recalculamos.</li>
<li>Todo es un corte al <b>30 de julio de 2026</b>. No se actualiza solo.</li>
</ul>
<h3>Qué no es este archivo</h3>
<p>Es un corte de solo lectura para revisión, no un sistema en vivo. Cualquier cambio — agregar un consultor, dar de baja a alguien, reinscribir a una persona — se hace en Learning @ Helix, y la vía más rápida es el correo de la pestaña <b>Agregar / dar de baja</b>.</p>`,

}};

/* ================= tooltip ================= */
const tt = $('#tt');
function showTT(e, html){ tt.innerHTML = html; tt.classList.add('on'); moveTT(e); }
function moveTT(e){
  const r = tt.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tt.style.left = x+'px'; tt.style.top = y+'px';
}
const hideTT = () => tt.classList.remove('on');
function bindTT(el, html){
  el.addEventListener('mouseenter', e=>showTT(e, html));
  el.addEventListener('mousemove', moveTT);
  el.addEventListener('mouseleave', hideTT);
  el.setAttribute('tabindex','0');
  el.addEventListener('focus', ()=>{ const b=el.getBoundingClientRect(); showTT({clientX:b.left+b.width/2, clientY:b.top}, html); });
  el.addEventListener('blur', hideTT);
}

/* clicking a KPI applies the matching filters and jumps to the right tab */
function tileAction(act){
  const [tab, mode] = act.split(':');
  if (tab==='roster'){
    openRows.clear();
    $('#q').value=''; $('#fEntity').value=''; $('#fCountry').value=''; $('#fStatus').value='';
    $('#fCert').value = mode==='hascert' ? 'has' : '';
    $('#fOpen').value = mode==='open' ? 'yes' : '';
    rSort = mode==='done' ? {k:'completionRate', dir:-1}
          : mode==='open' ? {k:'openCount', dir:-1}
          : mode==='hascert' ? {k:'certsActive', dir:-1}
          : {k:'enrollments', dir:-1};
    renderRoster(); goTab('roster');
  } else {
    $('#cq').value=''; $('#cEntity').value=''; $('#cCountry').value='';
    $('#cLevel').value = (mode==='bca'||mode==='bcp') ? mode.toUpperCase() : '';
    $('#cFy').value = (mode==='all'||mode==='bca'||mode==='bcp') ? '' : (mode==='valid' ? '' : mode.toUpperCase());
    if (mode==='valid') { $('#cFy').value=''; }
    cSort = {k:'renew', dir:1};
    renderCerts(); goTab('certs');
  }
}

function quarters(){
  const m = {};
  C.forEach(c=>{
    if(!c.renew) return;
    const y=+c.renew.slice(0,4), mo=+c.renew.slice(5,7);
    const f = mo>=4 ? y+1 : y, q = Math.floor(((mo-4+12)%12)/3)+1, k = `FY${f-2000} Q${q}`;
    (m[k] = m[k] || {k, fy:f, q, n:0, people:new Set()});
    m[k].n++; m[k].people.add(c.person);
  });
  return Object.values(m).sort((a,b)=> a.fy-b.fy || a.q-b.q);
}

let rSort = {k:'enrollments', dir:-1};
const openRows = new Set();
const statusLabel = s => s==='Active'?t('statusActive') : s==='Slipping'?t('statusSlipping') : t('statusStale');
const courseStatusLabel = s => s==='Completed'?t('stCompleted') : s==='In Progress'?t('stInProgress') : t('stNotStarted');
function statusChip(p){
  const cls = p.status==='Active'?'good':p.status==='Slipping'?'warn':'crit';
  return `<span class="chip ${cls}"><span class="dot"></span>${statusLabel(p.status)}</span>`;
}
function meter(p){
  const tt2 = p.enrollments || 1;
  const wc=100*p.completed/tt2, wi=100*p.inProgress/tt2, wn=100*p.notStarted/tt2;
  return `<div class="meter"><div class="track">
    ${wc?`<div class="seg2" style="flex:0 0 ${wc}%;background:var(--ord-3)"></div>`:''}
    ${wi?`<div class="seg2" style="flex:0 0 ${wi}%;background:var(--ord-2)"></div>`:''}
    ${wn?`<div class="seg2" style="flex:0 0 ${wn}%;background:var(--ord-1)"></div>`:''}
  </div><span class="pct">${p.completionRate}%</span></div>`;
}
function rosterFiltered(){
  const q = $('#q').value.trim().toLowerCase();
  const e=$('#fEntity').value, c=$('#fCountry').value, s=$('#fStatus').value, ce=$('#fCert').value, op=$('#fOpen').value;
  return P.filter(p=>{
    if (q && !p.name.toLowerCase().includes(q)) return false;
    if (e && p.entity !== e) return false;
    if (c && (c==='__none' ? p.country : p.country !== c)) return false;
    if (s && p.status !== s) return false;
    if (ce==='has' && p.certsActive===0) return false;
    if (ce==='none' && p.certsActive>0) return false;
    if (ce==='fy27' && p.fy27===0) return false;
    if (op==='yes' && p.openCount===0) return false;
    if (op==='none' && p.openCount>0) return false;
    return true;
  });
}

  rows.sort((a,b)=>{

    return `<tr class="${r.review?'reviewrow':''}">
      <td><div class="name">${esc(r.person)}</div>${r.review?`<span class="rev">${t('revBadge')}</span>`:''}</td>
      <td>${esc(r.title)}</td>
      <td><span class="lvl ${r.level==='BCP'?'bcp':'bca'}">${esc(r.level)}</span></td>
      <td class="mini">${r.entity==='TDI S.A.'?'TDI S.A.':'TDI LATAM'}</td>
      <td class="mini">${fmtD(r.issued)}</td>
      <td style="${f27?'color:var(--critical);font-weight:600':''}">${fmtD(r.renew)}</td>
      <td class="num">${dl==null?'—':`<span class="chip ${urg}"><span class="dot"></span>${dl}</span>`}</td>
      <td><span class="chip ${f27?'fy27':'neutral'}">${esc(r.fy)}</span></td>
    </tr>`;
  }).join('') || `<tr><td colspan="8" class="empty">${t('noMatch')}</td></tr>`;
}
$$('#certTable thead th[data-k]').forEach(th=>{
  th.onclick = ()=>{
    const k = th.dataset.k;
    cSort = {k, dir: cSort.k===k ? -cSort.dir : 1};
    $$('#certTable thead th').forEach(x=>x.removeAttribute('aria-sort'));
    th.setAttribute('aria-sort', cSort.dir===1?'ascending':'descending');
    renderCerts();
  };
});
['#cq','#cFy','#cLevel','#cEntity','#cCountry'].forEach(s=>$(s).addEventListener('input', renderCerts));

/* ================= copy ================= */
$('#copyTpl').onclick = async ()=>{
  try { await navigator.clipboard.writeText($('#tplText').textContent); $('#copyTpl').textContent = t('mgCopied'); }
  catch { const r=document.createRange(); r.selectNode($('#tplText')); getSelection().removeAllRanges(); getSelection().addRange(r); $('#copyTpl').textContent = t('mgSelect'); }
  setTimeout(()=>$('#copyTpl').textContent = t('mgCopy'), 2600);
};

/* ================= language ================= */
function setLang(x, keepFilters){
  L = x;
  applyStatic();
  buildTiles(); buildActions(); buildBench();
  buildFilters(keepFilters);
  // dynamic prose with numbers
  $('[data-t="mgAsk1P"]').innerHTML = t('mgAsk1P',{n:T.fy27});
  $('[data-t="mgAsk2P"]').innerHTML = t('mgAsk2P',{n:T.consultants});
  $('[data-t="chStatusNote"]').innerHTML = t('chStatusNote',{n:nf(T.enrollments)});
  $('[data-t="chStatusFoot"]').innerHTML = t('chStatusFoot',{o:nf(T.inProgress+T.notStarted)});
  $('[data-t="chQNote"]').innerHTML = t('chQNote',{n:T.certs});
  $('[data-t="chCatNote"]').innerHTML = t('chCatNote',{n:T.consultants});
  $('#validNote').innerHTML = t('validNote',{v:T.validPast27, f:T.fy27});
  renderRoster(); renderCerts();
  if (ready) drawAll();
}
$('#langEn').onclick = ()=>setLang('en', true);
$('#langEs').onclick = ()=>setLang('es', true);

/* ================= draw ================= */
function syncSticky(){
  const panel = $$('.panel').find(p=>!p.hidden);
  const f = panel && panel.querySelector('.filters');
  const h = f ? Math.round(f.getBoundingClientRect().height) : 0;
  // 45px nav + filter-bar height + the 17px mask that hides the gap beneath it
  document.documentElement.style.setProperty('--tableTop', (45 + h + 17) + 'px');
}
function drawAll(){ drawStatus(); drawQ(); drawM(); drawTops(); drawCat(); syncSticky(); }
if (window.ResizeObserver) {
  const ro = new ResizeObserver(()=>syncSticky());
  $$('.filters').forEach(f=>ro.observe(f));
}
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme','dark');
setLang('en', false);
goTab('overview');
ready = true;
drawAll();
let rt; addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(drawAll, 160); });
</script>
</body>
</html>
